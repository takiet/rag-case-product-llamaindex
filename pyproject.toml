[project]
name = "rag-case-products-llamaindex"
version = "0.1.0"
description = "RAG prototype for Axis product and case study search"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "llama-index-core>=0.12",
    "llama-index-llms-openai",
    "llama-index-embeddings-openai",
    "llama-index-agent-openai",
    "llama-index-postprocessor-sbert-rerank",
    "markitdown",
    "chainlit",
    "pydantic>=2",
    "python-dotenv",
    "sentence-transformers>=5.5.0",
    "llama-cloud>=2.5.0",
    "httpx",
]

[dependency-groups]
dev = ["ruff", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_case_products"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
